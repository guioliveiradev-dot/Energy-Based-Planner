<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Energy Based Planner</title>
  <meta name="description" content="Planeje suas tarefas pelo seu nível de energia.">
  <meta name="theme-color" content="#F7F6F2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Energy Based Planner">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  <script>
    /* Aplica o último tema antes de pintar a tela (evita piscar). Sem escolha anterior: Papel. */
    try { var t = localStorage.getItem('energy-planner-last-theme'); document.documentElement.setAttribute('data-theme', t && t !== 'default' ? t : 'papel'); }
    catch (e) { document.documentElement.setAttribute('data-theme', 'papel'); }
  </script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/progress.css">
</head>
<body>
  <div id="app"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="route-announcer" class="sr-only" aria-live="polite"></div>
  <!-- Confete do modal de parabéns (opcional: se falhar, o app funciona sem confete) -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
